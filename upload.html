<!DOCTYPE html>
<html>
<head>
    <title>Syllabus to Calendar Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .upload-area {
            border: 3px dashed #667eea;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 20px 0;
        }
        .upload-area:hover {
            background: #f0f0f0;
        }
        input[type="file"] {
            display: none;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }
        button:hover {
            background: #5568d3;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        #events {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .event {
            background: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
            border-radius: 3px;
        }
        .event-title {
            font-weight: bold;
            color: #333;
        }
        .event-date {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .download-btn {
            background: #28a745;
            margin-top: 15px;
        }
        .download-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Syllabus to Calendar</h1>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p><strong>Click to upload or drag & drop</strong></p>
            <p style="color: #999;">PDF, TXT, or MD files (max 20 MB)</p>
            <input type="file" id="fileInput" accept=".pdf,.txt,.md" onchange="uploadFile(event)">
        </div>

        <button onclick="document.getElementById('fileInput').click()">Choose File</button>

        <div id="status"></div>
        <div id="events"></div>
    </div>

    <script>
        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const statusDiv = document.getElementById('status');
            statusDiv.className = 'loading';
            statusDiv.textContent = 'Processing syllabus...';
            statusDiv.style.display = 'block';

            try {
                const response = await fetch('http://localhost:8000/process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }

                statusDiv.className = 'success';
                statusDiv.textContent = `✓ Successfully extracted ${data.count} events!`;

                displayEvents(data.events);
                showDownloadButton(data.events);

            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = `✗ Error: ${error.message}`;
            }
        }

        function displayEvents(events) {
            const eventsDiv = document.getElementById('events');
            eventsDiv.innerHTML = '';
            
            events.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event';
                eventDiv.innerHTML = `
                    <div class="event-title">${event.task_name}</div>
                    <div>${event.course_name}</div>
                    <div class="event-date">📅 ${event.due_date} at ${event.due_time}</div>
                    <div style="color: #666; font-size: 0.85em; margin-top: 5px;">${event.description}</div>
                `;
                eventsDiv.appendChild(eventDiv);
            });

            eventsDiv.style.display = 'block';
        }

        function showDownloadButton(events) {
            const statusDiv = document.getElementById('status');
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = 'Download as .ics Calendar File';
            downloadBtn.onclick = () => downloadCalendar(events);
            statusDiv.appendChild(downloadBtn);
        }

        async function downloadCalendar(events) {
            try {
                const response = await fetch('http://localhost:8000/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ events })
                });

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'syllabus_events.ics';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Download failed: ' + error.message);
            }
        }

        // Drag and drop support
        const uploadArea = document.querySelector('.upload-area');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        uploadArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.getElementById('fileInput').files = files;
            uploadFile({ target: { files } });
        });
    </script>
</body>
</html>
